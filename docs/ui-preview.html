<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KhetiMitra – AgriTech</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e3;--card:#fffdf6;--ink:#23301f;--mut:#6b7561;--g:#2f6b3a;--g2:#d9e8c8;--sun:#e8a317;--red:#c4472f;--line:#e3dcc6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a12;--card:#1c241a;--ink:#eef0e2;--mut:#98a38c;--g:#7cc481;--g2:#27381f;--sun:#f0b73a;--red:#ee7a62;--line:#2e3a28}}
:root[data-theme="dark"]{--bg:#141a12;--card:#1c241a;--ink:#eef0e2;--mut:#98a38c;--g:#7cc481;--g2:#27381f;--sun:#f0b73a;--red:#ee7a62;--line:#2e3a28}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0}
header{background:var(--g);color:#fff;padding:14px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
:root[data-theme="dark"] header,:root:not([data-theme="light"]) header{}
header h1{font-size:22px;flex:1}header button,header select{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:20px;padding:6px 12px;font:inherit;cursor:pointer}
header option{color:#000}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--g);color:#fff;border-color:var(--g)}
main{max-width:1000px;margin:0 auto;padding:18px 14px 40px}
.hero{background:linear-gradient(135deg,var(--g2),var(--card));border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero h2{font-size:28px}.hero p{color:var(--mut);margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{font-size:17px;margin-bottom:8px}
.big{font:800 34px 'Fraunces',serif;color:var(--g)}.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;background:var(--g2);color:var(--g)}
.tag.hi{background:rgba(196,71,47,.15);color:var(--red)}.tag.md{background:rgba(232,163,23,.18);color:var(--sun)}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
input,select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}svg{max-width:100%}
.days{display:flex;gap:8px;overflow-x:auto}.day{min-width:84px;text-align:center;padding:10px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.day b{display:block;font-size:20px}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
#login .card{max-width:380px;width:100%;text-align:center}
.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}.seg .on{background:var(--g);color:#fff}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
</style></head><body>
<div id="login"><div class="card"><div style="font-size:54px">🌾</div><h1>KhetiMitra</h1>
<p class="mut" id="tag">Empowering farmers through digital technology</p>
<div class="seg" id="roleSeg"><button class="on" data-r="farmer">👨‍🌾 Farmer</button><button data-r="admin">🛡️ Admin</button></div>
<input id="email" placeholder="Email" value="ramesh@farm.in"><input id="pw" type="password" placeholder="Password" value="demo1234">
<button class="btn" style="width:100%" onclick="login()">Sign in</button>
<p class="mut">Demo: JWT session simulated in memory</p></div></div>
<header><h1>🌾 KhetiMitra</h1>
<select id="lang" onchange="setLang(this.value)"><option value="en">English</option><option value="hi">हिन्दी</option></select>
<button onclick="toggleTheme()">◐</button><button onclick="logout()" id="out"></button></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const T={en:{dash:'Dashboard',wx:'Weather',soil:'Soil',pest:'Pests',mkt:'Market',exp:'Experts',adm:'Admin',hi:'Namaste',out:'Sign out',
sub:'Your farm at a glance today.',yield:'Yield forecast',moist:'Soil moisture',alerts:'Active alerts',orders:'Open orders',analyse:'Analyse soil',cart:'Add to cart',ask:'Ask'},
hi:{dash:'डैशबोर्ड',wx:'मौसम',soil:'मिट्टी',pest:'कीट',mkt:'बाज़ार',exp:'विशेषज्ञ',adm:'एडमिन',hi:'नमस्ते',out:'साइन आउट',
sub:'आज आपके खेत की झलक।',yield:'उपज अनुमान',moist:'मिट्टी की नमी',alerts:'सक्रिय चेतावनी',orders:'खुले ऑर्डर',analyse:'मिट्टी जाँचें',cart:'कार्ट में जोड़ें',ask:'पूछें'}};
let L='en',role='farmer',tab='dash',cart=[],posts=[['Anita','Best time to sow wheat after soybean?'],['Imran','Drip irrigation subsidy details?']];
const $=s=>document.querySelector(s),t=k=>T[L][k]||k;
const wx=[['Mon','☀️',33,5],['Tue','⛅',31,10],['Wed','🌧️',27,80],['Thu','🌧️',26,70],['Fri','⛅',29,20],['Sat','☀️',32,0],['Sun','☀️',34,0]];
const pests=[['Soybean stem fly','hi','Spray neem oil 5ml/L within 48h'],['Aphids on mustard','md','Monitor yellow sticky traps'],['Wheat rust','md','Use resistant seed next season'],['Locust swarm (far)','','No action; stay informed']];
const prods=[['Hybrid wheat seed','₹42/kg','🌱'],['NPK 19-19-19','₹1,250/bag','🧪'],['Neem pesticide','₹380/L','🍃'],['Drip kit (1 acre)','₹14,500','💧']];
const experts=[['Dr. Meera Rao','Agronomist','Online'],['S. Patel','Soil scientist','Online'],['Dr. A. Khan','Plant pathologist','Away']];
function login(){role=document.querySelector('#roleSeg .on').dataset.r;$('#login').style.display='none';build()}
function logout(){$('#login').style.display='flex'}
document.querySelectorAll('#roleSeg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#roleSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
function setLang(v){L=v;build()}
function toggleTheme(){const r=document.documentElement;const d=(r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
function build(){$('#out').textContent=t('out');
const tabs=['dash','wx','soil','pest','mkt','exp'].concat(role==='admin'?['adm']:[]);
$('#nav').innerHTML=tabs.map(k=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';build()">${t(k)}</button>`).join('');render()}
function chart(){const v=[3.1,3.4,3.2,3.9,4.2,4.6],m=['May','Jun','Jul','Aug','Sep','Oct'];
return `<svg viewBox="0 0 300 130" role="img" aria-label="Yield chart">${v.map((y,i)=>`<rect x="${14+i*47}" y="${110-y*20}" width="30" height="${y*20}" rx="6" fill="var(--g)" opacity="${.45+i*.1}"/><text x="${29+i*47}" y="125" font-size="10" text-anchor="middle" fill="var(--mut)">${m[i]}</text><text x="${29+i*47}" y="${104-y*20}" font-size="10" text-anchor="middle" fill="var(--ink)">${y}</text>`).join('')}</svg>`}
function line(){const p=wx.map((w,i)=>`${20+i*43},${100-(w[2]-24)*7}`).join(' ');
return `<svg viewBox="0 0 320 120"><polyline points="${p}" fill="none" stroke="var(--sun)" stroke-width="3"/>${wx.map((w,i)=>`<circle cx="${20+i*43}" cy="${100-(w[2]-24)*7}" r="4" fill="var(--sun)"/><text x="${20+i*43}" y="${90-(w[2]-24)*7}" font-size="10" text-anchor="middle" fill="var(--ink)">${w[2]}°</text>`).join('')}</svg>`}
function render(){const m=$('#main');
if(tab==='dash')m.innerHTML=`<div class="hero"><div style="font-size:56px">🧑‍🌾</div><div><h2>${t('hi')}, ${role==='admin'?'Admin':'Ramesh'}!</h2><p>${t('sub')} Bhopal · 12 acres · Wheat &amp; Soybean</p></div></div>
<div class="grid"><div class="card"><h3>${t('yield')}</h3><div class="big">4.6 t/ha</div><span class="tag">+9% vs last season</span>${chart()}</div>
<div class="card"><h3>${t('moist')}</h3><div class="big">62%</div><div class="bar"><i style="width:62%"></i></div><p class="mut">Optimal range 55–70%. No irrigation needed today.</p></div>
<div class="card"><h3>${t('alerts')}</h3><div class="big" style="color:var(--red)">2</div><p class="mut">Stem fly risk high · Heavy rain Wed–Thu</p></div>
<div class="card"><h3>${t('orders')}</h3><div class="big">${cart.length+1}</div><p class="mut">Seeds arriving Friday</p></div></div>`;
if(tab==='wx')m.innerHTML=`<div class="card"><h3>7-day forecast</h3><div class="days">${wx.map(w=>`<div class="day">${w[0]}<b>${w[1]}</b>${w[2]}°<div class="mut">💧${w[3]}%</div></div>`).join('')}</div>${line()}<p class="mut">⚠️ Delay spraying on Wed–Thu: rain probability above 70%.</p></div>`;
if(tab==='soil')m.innerHTML=`<div class="card" style="max-width:480px"><h3>🧪 ${t('analyse')}</h3><label>pH</label><input id="ph" type="number" step=".1" value="6.4"><label>Nitrogen (kg/ha)</label><input id="n" type="number" value="190"><label>Crop</label><select id="cr"><option>Wheat</option><option>Soybean</option><option>Mustard</option></select><button class="btn" onclick="soil()">${t('soil')} →</button><div id="res" style="margin-top:14px"></div></div>`;
if(tab==='pest')m.innerHTML=`<div class="card"><h3>🐛 ${t('pest')}</h3>${pests.map(p=>`<div class="row"><div><b>${p[0]}</b><div class="mut">${p[2]}</div></div><span class="tag ${p[1]}">${p[1]==='hi'?'High':p[1]==='md'?'Medium':'Low'}</span></div>`).join('')}</div>`;
if(tab==='mkt')m.innerHTML=`<div class="grid">${prods.map((p,i)=>`<div class="card"><div style="font-size:40px">${p[2]}</div><h3>${p[0]}</h3><div class="big" style="font-size:22px">${p[1]}</div><button class="btn" onclick="cart.push(${i});this.textContent='✓ ${cart.length+1}'">${t('cart')}</button></div>`).join('')}</div>`;
if(tab==='exp')m.innerHTML=`<div class="grid"><div class="card"><h3>👩‍🔬 ${t('exp')}</h3>${experts.map(e=>`<div class="row"><div><b>${e[0]}</b><div class="mut">${e[1]}</div></div><span class="tag ${e[2]==='Away'?'md':''}">${e[2]}</span></div>`).join('')}</div>
<div class="card"><h3>💬 Community</h3><div id="posts">${postsHtml()}</div><input id="np" placeholder="Share a question…"><button class="btn" onclick="post()">${t('ask')}</button></div></div>`;
if(tab==='adm')m.innerHTML=`<div class="grid"><div class="card"><h3>👥 Users</h3><div class="big">1,284</div><p class="mut">42 pending verification</p></div><div class="card"><h3>📦 Orders to approve</h3><div class="big">17</div><button class="btn">Review</button></div><div class="card"><h3>🚩 Moderation</h3><div class="big">3</div><p class="mut">Forum posts flagged</p></div></div>`}
function postsHtml(){return posts.map(p=>`<div class="row"><div><b>${p[0]}</b><div class="mut">${p[1]}</div></div></div>`).join('')}
function post(){const v=$('#np').value.trim();if(v){posts.unshift(['You',v]);$('#posts').innerHTML=postsHtml();$('#np').value=''}}
function soil(){const ph=+$('#ph').value,n=+$('#n').value,c=$('#cr').value;let r=[];
r.push(ph<6?'Acidic: apply lime 2 q/acre.':ph>7.5?'Alkaline: add gypsum and organic matter.':'pH is ideal.');
r.push(n<180?'Low nitrogen: top-dress urea 20 kg/acre.':'Nitrogen adequate.');
const s=Math.max(30,Math.min(98,100-Math.abs(ph-6.8)*18-(n<180?15:0)));
$('#res').innerHTML=`<div class="mut">Health score for ${c}</div><div class="big">${Math.round(s)}/100</div><div class="bar"><i style="width:${s}%"></i></div><ul>${r.map(x=>`<li>${x}</li>`).join('')}</ul>`}
build()
</script></body></html>
